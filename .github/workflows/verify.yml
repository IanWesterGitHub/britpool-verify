name: Verify BritPool

# Runs about hourly (GitHub may start scheduled runs a few minutes late),
# and can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit results/ back to this repository

concurrency:
  group: verify
  cancel-in-progress: false

env:
  # The verifier is fetched at this exact commit, so anyone can see which code ran.
  VERIFIER_REPO: IanWesterGitHub/stratum-speed-test
  VERIFIER_COMMIT: cf47cae437ab74c9789ba91c36fb133ccf0e2d9c
  POOL_HOST: bch.britpool.com
  POOL_PORT: "3334"
  POOL_TLS: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch the verifier at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VERIFIER_REPO }}
          ref: ${{ env.VERIFIER_COMMIT }}
          path: verifier

      - name: Run the checks against the live pool
        id: checks
        continue-on-error: true
        run: python3 scripts/run_checks.py

      - name: Save the results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          STATUS=$(python3 -c "import json; print('PASS' if json.load(open('results/latest.json'))['passed'] else 'FAIL')")
          git commit -m "Verification $(date -u +%Y-%m-%dT%H:%MZ): $STATUS"
          git pull --rebase --quiet
          git push

      - name: Mark the run as failed if any check failed
        if: steps.checks.outcome != 'success'
        run: |
          echo "One or more checks failed - see the 'Run the checks' step above."
          exit 1
